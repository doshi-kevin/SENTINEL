[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinel-z"
version = "0.2.0"
description = "Explainable provenance-based APT detection with honest validation methodology."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Kevin Doshi", email = "kevin.doshi2@spit.ac.in" }]
keywords = [
    "security",
    "apt-detection",
    "intrusion-detection",
    "provenance-graphs",
    "explainable-ai",
    "mitre-attack",
    "darpa-tc",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Information Technology",
    "Topic :: Security",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]

# Pinned core runtime — exact versions for reproducibility.
dependencies = [
    "pandas==2.2.3",
    "numpy==2.1.3",
    "networkx==3.4.2",
    "fastavro==1.9.7",
    "scikit-learn==1.5.2",
    "joblib==1.5.3",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic==2.9.2",
]

[project.optional-dependencies]
# Phase 1 contrastive embeddings + Phase 2 production engine
ml = [
    "torch>=2.4,<3.0",
    "torch-geometric>=2.5,<3.0",
]
# Visualizations and plot regeneration
viz = [
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "tqdm>=4.66",
]
# Word/PDF report generation
docs = [
    "python-docx>=1.1",
    "pdfplumber>=0.11",
    "pypdf>=5.0",
]
# Development tooling
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.6",
    "black>=24.8",
    "mypy>=1.11",
    "pre-commit>=4.0",
    "gdown>=5.0",
]
# Convenience meta-extra: install everything
all = [
    "sentinel-z[ml,viz,docs,dev]",
]

[project.urls]
Homepage = "https://github.com/kevin-doshi/sentinel-z"
Repository = "https://github.com/kevin-doshi/sentinel-z"
Documentation = "https://github.com/kevin-doshi/sentinel-z#readme"
"Bug Tracker" = "https://github.com/kevin-doshi/sentinel-z/issues"
"Model Card" = "https://github.com/kevin-doshi/sentinel-z/blob/main/MODEL_CARD.md"

[project.scripts]
sentinel-ingest-e5  = "sentinel_z.cli.ingest_e5:main"
sentinel-ingest-e3  = "sentinel_z.cli.ingest_e3:main"
sentinel-train      = "sentinel_z.cli.train:main"
sentinel-detect     = "sentinel_z.cli.detect:main"
sentinel-validate   = "sentinel_z.cli.validate:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["sentinel_z*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-ra --strict-markers --tb=short"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (require real data)",
    "smoke: marks fast smoke tests",
]

[tool.coverage.run]
source = ["src/sentinel_z"]
branch = true
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["data", "models", ".venv", "frontend/.next"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
ignore = ["E501", "N803", "N806"]  # line length handled by formatter; numpy-style names

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["B008"]  # FastAPI Depends() in default args

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.mypy]
python_version = "3.10"
warn_return_any = false
warn_unused_configs = true
ignore_missing_imports = true
